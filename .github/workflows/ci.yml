name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  pipelines:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelines
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipelines/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: pytest

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nextgas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nextgas
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        run: |
          for f in $(ls db/migrations/*.sql | sort); do
            echo "Applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Corridor query smoke test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into stations (osm_id, name, geog) values
            ('node/smoke-near', 'Near', st_makepoint(-100.00, 40.0072)::geography),
            ('node/smoke-far',  'Far',  st_makepoint(-100.00, 40.0724)::geography);
          do $$
          declare n int;
          begin
            -- Route runs east-west along lat 40.0; near is ~0.5 mi north, far ~5 mi north.
            select count(*) into n from corridor_stations('LINESTRING(-100.1 40.0, -99.9 40.0)');
            if n <> 1 then
              raise exception 'expected 1 corridor station, got %', n;
            end if;
          end $$;
          delete from stations where osm_id like 'node/smoke-%';
          SQL
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipelines/pyproject.toml
      - run: pip install -e 'pipelines[dev]'
      - name: Ingest fixture twice (idempotency)
        working-directory: pipelines
        run: |
          ingest() {
            python -m nextgas_pipelines.ingest_osm \
              --elements-file tests/fixtures/overpass_sample.json \
              --nsi-file tests/fixtures/nsi_sample.json
          }
          ingest
          first=$(psql "$DATABASE_URL" -Atc "select count(*) from stations")
          ingest
          second=$(psql "$DATABASE_URL" -Atc "select count(*) from stations")
          echo "stations after run 1: $first, run 2: $second"
          test "$first" -gt 0
          test "$first" = "$second"
