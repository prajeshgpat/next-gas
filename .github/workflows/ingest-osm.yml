name: Ingest OSM stations

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipelines/pyproject.toml
      - run: pip install -e 'pipelines[dev]'
      - name: Run ingest
        working-directory: pipelines
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m nextgas_pipelines.ingest_osm
